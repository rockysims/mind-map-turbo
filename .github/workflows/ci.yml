name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same branch/PR when new commits land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · check · test · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `version:` input — `packageManager` in the root package.json is the
      # single source of truth, and action-setup@v4 reads it. The pinned input
      # was left at 9.0.0 when `packageManager` moved to pnpm 11, so the two
      # disagreed about which pnpm this repo builds with.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/mind-map-sv/pnpm-lock.yaml', 'pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter mind-map-sv exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter mind-map-sv exec playwright install-deps chromium

      # Cheap guard: the committed offline app shell must match the sources.
      - name: Check offline app shell freshness
        run: pnpm run check:offline-shell

      # The three Definition of Done gates from .cursor/rules/core.mdc.
      - name: Lint (prettier + eslint)
        run: pnpm --filter mind-map-sv lint

      - name: Type check (svelte-check)
        run: pnpm --filter mind-map-sv check

      # Unused files, exports, types and dependencies. ESLint cannot do this job
      # here: its `no-unused-modules` rule does not follow imports out of
      # `.svelte` files, and almost every consumer in this app is one.
      - name: Dead code (knip)
        run: pnpm --filter mind-map-sv knip

      - name: "Tests (vitest: server + client + storybook)"
        run: pnpm --filter mind-map-sv test:unit -- --run

      # Last: the e2e suite builds the app and serves it on the checkout's own
      # derived preview port (see scripts/dev-ports.mjs), so it is
      # the slowest gate and runs only once the faster ones are green.
      - name: End-to-end tests (playwright)
        run: pnpm --filter mind-map-sv run test:e2e
